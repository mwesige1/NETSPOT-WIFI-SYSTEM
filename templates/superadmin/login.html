{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Login — NETSPOT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #e8ecf0;
            border-radius: 20px;
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.06);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .brand-dot {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #0a0f2c;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-dot i { font-size: 18px; color: #60a5fa; }

        .brand-name { font-size: 16px; font-weight: 800; color: #1a1a2e; display: block; }
        .brand-sub { font-size: 12px; color: #9ca3af; display: block; margin-top: 1px; }

        .login-title { font-size: 22px; font-weight: 800; color: #1a1a2e; margin-bottom: 6px; }
        .login-sub { font-size: 13px; color: #9ca3af; margin-bottom: 28px; }

        .form-group { margin-bottom: 18px; }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #374151;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .input-wrap { position: relative; display: flex; align-items: center; }

        .input-wrap i {
            position: absolute;
            left: 14px;
            font-size: 16px;
            color: #9ca3af;
        }

        .input-wrap input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            color: #1a1a2e;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s ease;
            background: #f9fafb;
        }

        .input-wrap input:focus {
            border-color: #1a1a2e;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(26,26,46,0.06);
        }

        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: #dc2626;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #0a0f2c;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .btn-login:hover { background: #1a237e; }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand">
        <div class="brand-dot"><i class="bi bi-wifi"></i></div>
        <div>
            <span class="brand-name">NETSPOT</span>
            <span class="brand-sub">Platform Admin</span>
        </div>
    </div>

    <div class="login-title">Super Admin Access</div>
    <div class="login-sub">Sign in to manage the NETSPOT platform</div>

    {% if error %}
    <div class="error-box">
        <i class="bi bi-exclamation-circle-fill"></i>
        {{ error }}
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Username</label>
            <div class="input-wrap">
                <i class="bi bi-person-fill"></i>
                <input type="text" name="username" placeholder="Enter your username" autocomplete="username" required>
            </div>
        </div>
        <div class="form-group">
            <label>Password</label>
            <div class="input-wrap">
                <i class="bi bi-lock-fill"></i>
                <input type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
            </div>
        </div>
        <button type="submit" class="btn-login">
            <i class="bi bi-arrow-right-circle"></i> Sign In
        </button>
    </form>

    <div class="login-footer">
        <i class="bi bi-shield-lock"></i> Platform owner access only
    </div>
</div>

</body>
</html>
