{% extends 'superadmin/base.html' %}

{% block title %}New SMS Bundle{% endblock %}
{% block page_title %}New SMS Bundle{% endblock %}

{% block content %}

<div class="form-card">
    <h6 class="mb-2">Create SMS Bundle</h6>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label class="form-label">Bundle Name <span class="required">*</span></label>
            <input type="text" name="name" class="form-input" placeholder="e.g. Starter" required>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">SMS Count <span class="required">*</span></label>
                <input type="number" name="sms_count" class="form-input" min="1" required>
            </div>

            <div class="form-group">
                <label class="form-label">Price (UGX) <span class="required">*</span></label>
                <input type="number" name="price" class="form-input" min="0" step="0.01" required>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Display Order</label>
            <input type="number" name="display_order" class="form-input" value="0">
            <p class="form-hint">Lower numbers appear first on the tenant purchase page.</p>
        </div>

        <div class="form-group">
            <label class="form-check">
                <input type="checkbox" name="is_active" checked>
                Active (visible to tenants)
            </label>
        </div>

        <button type="submit" class="btn btn-primary w-full">Create Bundle</button>
        <a href="{% url 'superadmin:sms_bundles' %}" class="cancel-link">Cancel</a>
    </form>
</div>

{% endblock %}
