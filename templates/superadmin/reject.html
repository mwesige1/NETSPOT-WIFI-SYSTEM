<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reject Application — NETSPOT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0f1e; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 20px; }
        .card { background: #111827; border-radius: 16px; padding: 40px; width: 100%; max-width: 500px; border: 1px solid rgba(239,68,68,0.2); }
        h1 { font-size: 1.4rem; color: #EF4444; margin-bottom: 8px; }
        .business { font-size: 1.1rem; margin-bottom: 24px; color: #aaa; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 6px; }
        textarea {
            width: 100%; padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; color: #fff; font-size: 0.95rem;
            min-height: 120px; resize: vertical;
        }
        .btn-reject {
            width: 100%; padding: 14px; background: #EF4444;
            color: #fff; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 8px;
        }
        .back { display: block; text-align: center; margin-top: 16px; color: #aaa; text-decoration: none; font-size: 0.85rem; }
        .back:hover { color: #F5A623; }
    </style>
</head>
<body>
    <div class="card">
        <h1>✗ Reject Application</h1>
        <div class="business">{{ tenant.business_name }}</div>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Reason for rejection</label>
                <textarea name="reason" placeholder="Explain why this application is being rejected..." required></textarea>
            </div>
            <button type="submit" class="btn-reject">Reject Application</button>
        </form>

        <a href="{% url 'superadmin:applications' %}" class="back">← Back to applications</a>
    </div>
</body>
</html>
