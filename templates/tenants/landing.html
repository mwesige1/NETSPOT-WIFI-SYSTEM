<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETSPOT — WiFi Management Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0f1e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
        }
        h1 { font-size: 3rem; color: #F5A623; margin-bottom: 16px; }
        p  { font-size: 1.1rem; color: #aaa; margin-bottom: 40px; }
        .btn {
            display: inline-block;
            padding: 16px 40px;
            background: #F5A623;
            color: #0a0f1e;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
        }
        .btn:hover { background: #e69500; }
        .messages { margin-bottom: 20px; }
        .message-success {
            background: rgba(34,197,94,0.1);
            border: 1px solid #22C55E;
            color: #22C55E;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="message-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <h1>⚡ NETSPOT</h1>
        <p>Professional WiFi hotspot management platform for hotels, schools, and businesses across Uganda.</p>
        <a href="{% url 'tenants:signup' %}" class="btn">Start Free Trial</a>
    </div>
</body>
</html>
