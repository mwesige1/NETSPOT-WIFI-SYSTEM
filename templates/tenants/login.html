<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — NETSPOT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0f1e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .card {
            background: #111827;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(245,166,35,0.2);
        }
        .logo { font-size: 1.8rem; font-weight: 700; color: #F5A623; margin-bottom: 8px; }
        .subtitle { color: #aaa; font-size: 0.9rem; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 6px; }
        input {
            width: 100%; padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; color: #fff; font-size: 0.95rem;
        }
        input:focus { outline: none; border-color: #F5A623; }
        .btn {
            width: 100%; padding: 14px;
            background: #F5A623; color: #0a0f1e;
            border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 700;
            cursor: pointer; margin-top: 8px;
        }
        .btn:hover { background: #e69500; }
        .error {
            background: rgba(239,68,68,0.1);
            border: 1px solid #EF4444;
            color: #EF4444;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">⚡ NETSPOT</div>
        <div class="subtitle">Sign in to manage your WiFi network</div>

        {% if form.errors %}
        <div class="error">
            Invalid email or password. Please try again.
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Email Address</label>
                <input type="text" name="username" placeholder="your@email.com" autofocus required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div style="position:relative;">
    <input type="password" name="password" id="password" placeholder="••••••••" required style="padding-right:48px;">
    <button type="button" onclick="togglePassword()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#aaa;cursor:pointer;font-size:1rem;">👁</button>
</div>
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
    </div>
</body>

<script>
function togglePassword() {
    const input = document.getElementById('password');
    input.type = input.type === 'password' ? 'text' : 'password';
}
</script>
</html>
