{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join NETSPOT — Start Your Free Trial</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>

<div class="public-page-wrap">
    <div class="form-card public-form-card">

        <h1 class="public-form-title">⚡ Join NETSPOT</h1>
        <p class="public-form-subtitle">Start your 30-day free trial. No credit card required.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <p class="form-section-title">Business Information</p>

            <div class="form-group">
                <label class="form-label">Business Name <span class="required">*</span></label>
                <input type="text" name="business_name" class="form-input" placeholder="e.g. Serena Hotel Kampala" required>
            </div>

            <div class="form-group">
                <label class="form-label">Business Type <span class="required">*</span></label>
                <select name="business_type" class="form-select" required>
                    <option value="">Select type...</option>
                    <option value="hotel">Hotel</option>
                    <option value="school">School</option>
                    <option value="individual">Individual</option>
                    <option value="isp">ISP</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address <span class="required">*</span></label>
                <input type="email" name="email" class="form-input" placeholder="admin@yourbusiness.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Phone Number <span class="required">*</span></label>
                <input type="text" name="phone" class="form-input" placeholder="0700000000" required>
            </div>

            <div class="form-group">
                <label class="form-label">Location <span class="required">*</span></label>
                <input type="text" name="location" class="form-input" placeholder="e.g. Kampala, Uganda" required>
            </div>

            <hr class="form-divider">
            <p class="form-section-title">Responsible Person</p>

            <div class="form-group">
                <label class="form-label">Full Name <span class="required">*</span></label>
                <input type="text" name="contact_person_name" class="form-input" placeholder="e.g. Jane Nakato" required>
            </div>

           

            <div class="form-group">
                <label class="form-label">Role <span class="required">*</span></label>
                <select name="contact_person_role" class="form-select" required>
                    <option value="">Select role...</option>
                    <option value="owner">Owner</option>
                    <option value="manager">Manager</option>
                    <option value="staff">Staff</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-full">Submit Application</button>
        </form>

        <a href="{% url 'tenants:landing' %}" class="public-back-link">← Back to homepage</a>
    </div>
</div>

</body>
</html>
