<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join NETSPOT — Start Your Free Trial</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0f1e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .card {
            background: #111827;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(245,166,35,0.2);
        }
        h1 { font-size: 1.8rem; color: #F5A623; margin-bottom: 8px; }
        .subtitle { color: #aaa; font-size: 0.9rem; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #F5A623;
        }
        select option { background: #111827; }
        .btn {
            width: 100%;
            padding: 14px;
            background: #F5A623;
            color: #0a0f1e;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn:hover { background: #e69500; }
        .back { 
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .back:hover { color: #F5A623; }
        .messages { margin-bottom: 20px; }
        .message-error {
            background: rgba(239,68,68,0.1);
            border: 1px solid #EF4444;
            color: #EF4444;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>⚡ Join NETSPOT</h1>
        <p class="subtitle">Start your 30-day free trial. No credit card required.</p>

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="message-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Business Name</label>
                <input type="text" name="business_name"
                       placeholder="e.g. Serena Hotel Kampala" required>
            </div>

            <div class="form-group">
                <label>Business Type</label>
                <select name="business_type" required>
                    <option value="">Select type...</option>
                    <option value="hotel">Hotel</option>
                    <option value="school">School</option>
                    <option value="individual">Individual</option>
                    <option value="isp">ISP</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email"
                       placeholder="admin@yourbusiness.com" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" name="phone"
                       placeholder="0700000000" required>
            </div>

            <div class="form-group">
                <label>Location</label>
                <input type="text" name="location"
                       placeholder="e.g. Kampala, Uganda" required>
            </div>

            <button type="submit" class="btn">Submit Application</button>
        </form>

        <a href="{% url 'tenants:landing' %}" class="back">← Back to homepage</a>
    </div>
</body>
</html>
